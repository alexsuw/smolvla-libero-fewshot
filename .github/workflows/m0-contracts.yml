name: M0 and M1 static contracts

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static-contracts:
    name: Python 3.12 / Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.6.13"
          python-version: "3.12.8"
          enable-cache: true

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Verify universal lock is current
        run: uv lock --check

      - name: Run M0 and non-GPU M1 checks
        run: make check-m1-static
