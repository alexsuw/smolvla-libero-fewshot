name: M0-M3 static contracts

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static-contracts:
    name: Python 3.12 / Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.6.13"
          python-version: "3.12.8"
          enable-cache: true

      - name: Sync locked CPU environment with data extra
        run: uv sync --frozen --extra data

      - name: Verify universal lock is current
        run: uv lock --check

      - name: Run M0, non-GPU M1, M2, and M3 adapter checks
        run: make check-m3
