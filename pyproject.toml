[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "vla-fewshot"
version = "0.1.0"
description = "Reproducible few-shot adaptation of SmolVLA on LIBERO"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "smolvla-libero-fewshot contributors" }]
dependencies = [
  "certifi==2026.7.22",
  "pydantic>=2.10,<3",
  "pyyaml>=6.0.2,<7",
]

[project.optional-dependencies]
gpu = [
  "accelerate==1.14.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "hf-egl-probe==1.0.2; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "hf-libero==0.1.4; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "lerobot[libero,peft,smolvla]==0.6.2; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "mujoco==3.8.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "numpy==2.2.6; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "peft==0.20.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "tensorboard==2.20.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "torch==2.11.0+cu128; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "torchcodec==0.11.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "torchvision==0.26.0+cu128; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "transformers==5.5.4; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[dependency-groups]
dev = [
  "pre-commit>=4,<5",
  "pytest>=8.3,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vla_fewshot"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: requires downloaded data or external services",
  "gpu: requires a CUDA GPU",
]

[tool.uv]
package = true
required-environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
lerobot = { git = "https://github.com/huggingface/lerobot.git", rev = "d451fe4f1f1b00a812f95aa9534389b5e42ab155" }
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]
