kind: train
schema_version: 1
stage: target
method: replay_lora
model:
  repo_id: lerobot/smolvla_base
  revision: c83c3163b8ca9b7e67c509fffd9121e66cb96205
dataset:
  repo_id: nvidia/LIBERO_LeRobot_v3
  revision: e5907374380b8f96511957e6ba5582be52a1e179
  suite: libero_goal
  episodes: selected
trainable_scope:
  freeze_vision_encoder: true
  freeze_vlm_backbone: true
  train_action_expert: false
  train_state_projection: true
  train_action_projections: true
  strict_allowlist: true
optimizer:
  name: adamw
  lr: 1.0e-3
  weight_decay: 1.0e-2
  betas: [0.9, 0.95]
  eps: 1.0e-8
