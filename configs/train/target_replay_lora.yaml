  max_steps: 12000
  epochs: 100
  physical_batch_size: auto_fit
  effective_batch_size: 32
  gradient_accumulation: auto
  max_grad_norm: 1.0
  mixed_precision: auto
  seed: 42
  num_workers: 4
  sample_with_replacement: true
checkpoint:
  every_steps: 1000
  save_steps: [3000, 6000, 9000, 12000]
  milestones: []
  atomic: true
  verify_fresh_load: true
tracking:
  wandb_enabled: false
  tensorboard_enabled: true
  csv_enabled: true
  jsonl_events_enabled: true
peft:
  method_type: LORA
  r: 64
  lora_alpha: 64
  lora_dropout: 0.0
replay:
  enabled: true
  target_fraction: 0.75
  seen_fraction: 0.25
  seen_suite: libero_90
