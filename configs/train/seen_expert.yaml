kind: train
schema_version: 1
stage: seen
method: expert
model:
  repo_id: lerobot/smolvla_base
  revision: c83c3163b8ca9b7e67c509fffd9121e66cb96205
dataset:
  repo_id: nvidia/LIBERO_LeRobot_v3
  revision: e5907374380b8f96511957e6ba5582be52a1e179
  suite: libero_90
  episodes: all
trainable_scope:
  freeze_vision_encoder: true
  freeze_vlm_backbone: true
  train_action_expert: true
  train_state_projection: true
  train_action_projections: true
  strict_allowlist: true
optimizer:
  name: adamw
  lr: 1.0e-4
  weight_decay: 1.0e-2
  betas: [0.9, 0.95]
  eps: 1.0e-8
scheduler:
  name: cosine
  warmup_steps: 1000
  min_lr: 1.0e-5
training:
  max_steps: 100000
  physical_batch_size: auto_fit
  effective_batch_size: 32
  gradient_accumulation: auto
  max_grad_norm: 1.0
  mixed_precision: auto
  seed: 42
  num_workers: 8
  sample_with_replacement: false
checkpoint:
  every_steps: 5000
  save_steps: []
  milestones: [10000, 20000, 40000, 60000, 80000, 100000]
  atomic: true
  verify_fresh_load: true
tracking:
  wandb_enabled: false
  tensorboard_enabled: true
  csv_enabled: true
  jsonl_events_enabled: true
env:
  control_mode: relative
  hard_reset: true
action:
  dim: 7
