kind: env
schema_version: 1
control_mode: relative
action_dim: 7
hard_reset: true
observation_width: 256
observation_height: 256
cameras:
  main:
    source: agentview_image
    env_raw_key: image
    dataset_key: observation.images.image
    policy_key: observation.images.image
  wrist:
    source: robot0_eye_in_hand_image
    env_raw_key: image2
    dataset_key: observation.images.wrist_image
    policy_key: observation.images.wrist_image
orientation:
  lerobot_libero_processor_rot180: true
  project_transform: identity
gripper:
  binary_threshold: 0.5
  convert_before_env_step: true
